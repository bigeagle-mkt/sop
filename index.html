<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大鷹旅遊 團體作業 SOP｜審核建議版</title>
<style>
:root{--ink:#1f2937;--mut:#6b7280;--line:#cfd6df;--bg:#f3f5f8;--card:#fff;--pri:#1f4e78;--pri2:#2f6ea5;--soft:#e8f0f8;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
header.top{background:var(--pri);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:700}
header.top .sp{flex:1}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:5}
nav.tabs button{border:0;background:none;padding:11px 14px;font-size:14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
nav.tabs button:hover{color:var(--pri)}
main{max-width:1240px;margin:0 auto;padding:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--ink)}
button.b:hover{background:var(--soft)}
button.b.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.b.pri:hover{background:var(--pri2)}
header.top button.b{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--pri)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:0}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;text-align:center;line-height:26px;font-size:12px;font-weight:700}
.step .h{font-weight:600}.step .d{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--pri2);color:var(--pri);background:var(--soft);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--pri);color:#fff}
.sub{margin:6px 0 0 18px;padding:0;color:#374151}.sub li{margin:2px 0}
.layout{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start}
.side h3{margin:2px 0 8px;font-size:13px;color:var(--mut)}
.fitem{padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;font-size:13px}
.fitem:hover{background:var(--soft)}.fitem.on{background:var(--soft);border-color:var(--pri2)}
.fitem small{display:block;color:var(--mut)}
.tool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.tool .sp{flex:1}.tool input.nm{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;min-width:200px}
.stat{color:var(--mut);font-size:12px}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;overflow-x:auto}
/* forms */
.ftitle{text-align:center;font-size:20px;margin:0 0 10px;color:#111;letter-spacing:2px}
table.ft{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:13px}
table.ft th,table.ft td{border:1px solid #444;padding:2px 4px;vertical-align:middle}
table.ft th{background:#e9edf3;font-weight:600;text-align:center;white-space:nowrap}
table.ft th.sect{background:#cfd8e3;text-align:left}
table.ft td{background:#fff}
input.i,textarea.t,select.i{width:100%;border:0;background:transparent;font:inherit;padding:3px 2px;outline:none;color:#111}
input.i:focus,textarea.t:focus,select.i:focus{background:#fffbe6;outline:1px solid #e3c35a}
textarea.t{resize:vertical;display:block;min-height:24px;line-height:1.45}
input.num{text-align:right}
input.c{width:16px;height:16px;vertical-align:middle}
.split{display:grid;grid-template-columns:1fr 300px;gap:10px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.day{border:2px solid #2f6ea5;border-radius:6px;padding:8px;margin-bottom:12px;background:#fbfdff}
.dayh{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--pri);margin-bottom:4px}
.blk h4{margin:8px 0 3px;font-size:13px;color:var(--pri)}
.blk h3,.secttl{margin:12px 0 4px;font-size:14px;color:var(--pri)}
.addb{border:1px dashed #8aa;background:#fff;color:#357;border-radius:5px;font-size:12px;padding:2px 8px;cursor:pointer;margin:0 0 8px}
.addb:hover{background:var(--soft)}
button.x{border:0;background:none;color:#b91c1c;cursor:pointer;font-size:15px;line-height:1}
.ckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #444;margin-bottom:8px}
@media(max-width:900px){.ckgrid{grid-template-columns:repeat(2,1fr)}}
.ck{display:flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid #ddd;font-size:12.5px}
.ck span{flex:1}.ck input.q{width:48px;border-bottom:1px solid #999}
.note{font-size:12px;color:var(--mut);margin:4px 0}
.tv{white-space:pre-wrap}
.ref table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.ref th,.ref td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;white-space:pre-wrap}
.ref th{background:var(--soft)}
details{margin:8px 0}details>summary{cursor:pointer;font-weight:600;color:var(--pri)}
.gen label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}
.gen input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.gen pre{background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-family:inherit}
.search{width:100%;max-width:340px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:10px}
#printRoot{display:none}
@page{size:A4 portrait;margin:10mm}
@page land{size:A4 landscape;margin:8mm}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block;font-family:inherit;color:#000}
  #printRoot.land{page:land}
  #printRoot table.ft{font-size:11px;page-break-inside:auto}
  #printRoot tr{page-break-inside:avoid}
  #printRoot .split{grid-template-columns:1fr 240px}
  #printRoot .day{border:1px solid #444;page-break-inside:auto}
}
.ref-tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 14px;padding-bottom:8px}.ref-tab{border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:#fff;color:var(--pri);font:inherit;cursor:pointer}.ref-tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}.ref-tab:focus-visible{outline:3px solid #e3c35a;outline-offset:2px}.ref-empty{color:var(--mut);padding:12px 0} [hidden]{display:none!important}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inp=(v='',cls='',extra='')=>`<input class="i ${cls}" value="${e(v)}" ${extra}>`;
const ta=(v='',r=2)=>`<textarea class="t" rows="${r}">${e(v)}</textarea>`;
const cb=(on=false)=>`<input type="checkbox" class="c"${on?' checked':''}>`;
const sel=(opts,v='')=>`<select class="i">${opts.map(o=>`<option${o===v?' selected':''}>${e(o)}</option>`).join('')}</select>`;
const th=(t,a='')=>`<th ${a}>${t}</th>`,td=(h,a='')=>`<td ${a}>${h}</td>`,tr=(...c)=>`<tr>${c.join('')}</tr>`;
const DEL=`<td class="np" style="width:22px;text-align:center"><button class="x" data-act="del" title="刪除此列">×</button></td>`;
const addBtn=(name,label='＋ 新增一列')=>`<button type="button" class="addb np" data-act="add" data-rows="${name}">${label}</button>`;
const sect=(t,n=4)=>`<tr><th class="sect" colspan="${n}">${t}</th></tr>`;
const kv=(l,h,span=1)=>th(l)+td(h,span>1?`colspan="${span}"`:'');
/* generic grid tables: types i=input u=num a=amount(summed) c=checkbox t=textarea s=static k=input+datalist(kind) p=datalist(proof) */
const REG={};
function defGrid(name,cols,types){REG[name]={cols,types,make:(v=[])=>'<tr>'+types.map((t,i)=>{const x=v[i];
  return t==='c'?td(cb(!!x),'style="text-align:center"'):t==='t'?td(ta(x||'',1)):t==='s'?td(e(x??'')):t==='a'?td(inp(x,'num amt')):t==='u'?td(inp(x,'num')):t==='k'?td(inp(x,'','list="dl_kind"')):t==='p'?td(inp(x,'','list="dl_proof"')):td(inp(x))}).join('')+DEL+'</tr>'}}
function grid(name,defaults=[[]],extra=''){const g=REG[name];return `<div class="blk"><table class="ft ${extra}"><thead><tr>${g.cols.map(c=>th(c)).join('')}<th class="np"></th></tr></thead><tbody data-rows="${name}">${defaults.map(g.make).join('')}</tbody></table>${addBtn(name)}</div>`}

<div class="step"><span class="n">2</span><div><div class="h">工作期限與確認</div><div class="d">每項工作保存執行人、開始及截止日、狀態、確認人及確認紀錄；區間不能只保留一個日期。</div></div></div>
<div class="step"><span class="n">3</span><div><div class="h">手冊製作</div><div class="d">交辦 → 美編初稿 → OP／主辦人確認 → 退修或定稿 → 印製；保存各版本與確認結果。</div></div></div>
<div class="step"><span class="n">4</span><div><div class="h">領隊交接</div><div class="d">OP 交付、領隊接收分開記錄；標示文件版本、未交事項及出團前異動。</div></div></div>
<div class="step"><span class="n">5</span><div><div class="h">火車備品</div><div class="d">總表 → 箱袋 → 品項 → 清點與測試 → 運送點交 → 返還；未成箱物品獨立列管。</div></div></div>
<div class="step"><span class="n">6</span><div><div class="h">旅途中與返團</div><div class="d">領隊／導遊記錄異常、處理人及交接結果；返團核對備品與尚待處理事項。</div></div></div></div></div>

<div class="card"><h2>五、現有版本與正式作業差距</h2><ul class="sub">
<li><b>團體關聯：</b>表單各自儲存，雖可輸入團號，尚未形成同一團的資料與工作關聯。</li>
<li><b>期限：</b>火車檢核表可推算部分相對日期；原表的「90～60 天前」目前取單一天數，新增列也未完整設定相對天數。</li>
<li><b>確認：</b>勾選或填寫姓名，不等於可追溯的身分驗證、確認版本與簽核紀錄。</li>
<li><b>多人協作：</b>本版資料存在瀏覽器，換裝置不會同步；正式作業需登入、後端資料、附件保存與權限控制。</li>
<li><b>文件輸出：</b>目前 Excel／Word 匯出是 HTML 內容搭配舊格式副檔名；如需原生檔案應另作相容性驗證。</li>
<li><b>舊資料：</b>原始價格、數量、聯絡資料與作業時程屬歷史參考，使用前應由公司確認；避免直接當成通用規則。</li>
</ul></div>

<div class="card"><h2>六、建議實施順序與待確認事項</h2><div class="paper"><table class="ft"><thead><tr><th>順序</th><th>範圍</th><th>驗收重點</th></tr></thead><tbody>
<tr><td>1</td><td>以一個火車團和一個國旅團確認角色、工作及必要文件</td><td>執行人、確認人、期限及交接條件清楚</td></tr>
<tr><td>2</td><td>團體主檔、工作期限、確認及主管總表</td><td>從總表下鑽到工作與負責人</td></tr>
<tr><td>3</td><td>文件版本、美編流程與領隊交接</td><td>能查到版本、確認結果與接收紀錄</td></tr>
<tr><td>4</td><td>火車備品、運送與返還</td><td>能追蹤箱袋、短缺、點交及返還</td></tr>
<tr><td>5</td><td>依 ERP 實際程式查核後規劃串接</td><td>避免團體、旅客及訂單資料重複維護</td></tr></tbody></table></div>
<p><b>待公司確認：</b>主管必須確認哪些事項？業務何時交 OP？手冊由誰確認定稿？領隊與導遊各能看哪些資料？哪些缺件需要主管決定？</p></div>
`;}

function render(){
  renderTabs();const v=$('#view');const t=TABS.find(x=>x.id===curTab);
  if(curTab==='review')v.innerHTML=renderReview();
  else if(curTab==='sop')v.innerHTML=renderSOP();
  else if(curTab==='ref'){v.innerHTML=renderRef();setupRef()}
  else{v.innerHTML=renderFormTab(t);afterLoad();if(t.gen){['g1','g2','g3','g4'].forEach(i=>$('#'+i).oninput=upGen);upGen();$('#gcopy').onclick=()=>{navigator.clipboard.writeText(genText()).then(()=>{$('#gst').textContent='已複製';setTimeout(()=>$('#gst').textContent='',1500)}).catch(()=>{const r=document.createRange();r.selectNode($('#gout'));getSelection().removeAllRanges();getSelection().addRange(r);$('#gst').textContent='請按 Cmd/Ctrl+C 複製'})}}}
  window.scrollTo(0,0)}
function upGen(){$('#gout').textContent=genText()}
function afterLoad(){const r=$(FA);if(!r)return;$$('textarea',r).forEach(grow);renumber();calc()}
const grow=t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,24)+'px'};
function renumber(){$$('.day .dn').forEach((s,i)=>s.textContent=i+1)}
const num=s=>parseFloat(String(s).replace(/,/g,''))||0;
const fmt=n=>n?n.toLocaleString('zh-TW'):'';
function calc(){const r=$(FA);if(!r)return;
  const tot=$('.total',r);if(tot){const s=$$('.amt',r).reduce((a,i)=>a+num(i.value),0);tot.value=s?fmt(s):'';const ap=$('.apply',r),ret=$('.ret',r);if(ap&&ret){const d=num(ap.value)-s;ret.value=(ap.value||s)?fmt(d)||'0':''}}
  const dep=$('.dep',r);if(dep){$$('tr[data-days]',r).forEach(tr=>{const d=tr.dataset.days,sp=$('.due',tr);if(!sp)return;if(dep.value&&d!==''){const dt=new Date(dep.value+'T00:00:00');dt.setDate(dt.getDate()-parseInt(d));sp.textContent=(dt.getMonth()+1)+'/'+dt.getDate()}else sp.textContent=''})}}
/* snapshot & save */
function snapshot(root){
  $$('input:not([type=checkbox])',root).forEach(i=>i.setAttribute('value',i.value));
  $$('input[type=checkbox]',root).forEach(i=>i.checked?i.setAttribute('checked',''):i.removeAttribute('checked'));
  $$('textarea',root).forEach(t=>t.textContent=t.value);
  $$('select',root).forEach(s=>[...s.options].forEach(o=>o.selected?o.setAttribute('selected',''):o.removeAttribute('selected')))}
let saveT;
function curForm(){const t=TABS.find(x=>x.id===curTab);const c=cur[curTab];return c&&forms.find(f=>f.id===c.id)}
function saveNow(){const f=curForm(),r=$(FA);if(!f||!r)return;calc();snapshot(r);f.html=r.innerHTML;f.updated=Date.now();const ok=saveAll();const s=$('#fstat');if(s)s.textContent=ok?'已自動儲存 '+new Date().toLocaleTimeString('zh-TW'):'⚠ 瀏覽器無法儲存(請用匯出備份)'}
const later=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,350)};
/* flatten for print/export */
function flatten(root){snapshot(root);const c=root.cloneNode(true);
  $$('.np',c).forEach(n=>n.remove());
  $$('input[type=checkbox]',c).forEach(i=>{const s=document.createElement('span');s.textContent=i.hasAttribute('checked')?'☑':'☐';i.replaceWith(s)});
  $$('select',c).forEach(s=>{const o=s.querySelector('option[selected]')||s.options[0];const x=document.createElement('span');x.textContent=o?o.textContent:'';s.replaceWith(x)});
  $$('textarea',c).forEach(t=>{const d=document.createElement('div');d.className='tv';d.textContent=t.textContent;t.replaceWith(d)});
  $$('input',c).forEach(i=>{const s=document.createElement('span');s.textContent=i.getAttribute('value')||'';i.replaceWith(s)});
  $$('details',c).forEach(d=>d.remove());return c}
const EXPORT_CSS='body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:12px}table{border-collapse:collapse;width:100%;margin-bottom:6px}th,td{border:1px solid #000;padding:2px 4px;vertical-align:top}th{background:#e9edf3}.ftitle{text-align:center;font-size:18px}.tv{white-space:pre-wrap}.sect{background:#cfd8e3;text-align:left}.ckgrid{display:block}.ck{display:block;border:0}.split{display:block}';
function download(name,mime,body){const b=new Blob(['﻿'+body],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const fileName=ext=>{const f=curForm();return (f?f.name:'表單').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext};
function doPrint(){const r=$(FA);const f=curForm();const pr=$('#printRoot');pr.innerHTML='';pr.appendChild(flatten(r));pr.className=TPL[f.type].landscape?'land':'';
  const done=()=>{pr.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);window.print()}
/* ================= events ================= */
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){const t=TABS.find(x=>x.id===g.dataset.go);if(g.dataset.ref&&t.ref){t._open=t.ref[0]}setTab(g.dataset.go,g.dataset.type||undefined);if(g.dataset.ref){setTimeout(()=>{const d=$('details');d&&(d.open=true,d.scrollIntoView())},50)}return}
  const tb=ev.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const ft=ev.target.closest('.fitem[data-type]');if(ft){cur[curTab]={type:ft.dataset.type};render();return}
  const fi=ev.target.closest('.fitem[data-fid]');if(fi){cur[curTab].id=fi.dataset.fid;render();return}
  const a=ev.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,r=$(FA);
  if(act==='add'){const blk=a.closest('.blk'),tb=blk.querySelector(`tbody[data-rows="${a.dataset.rows}"]`);const mk=REG[a.dataset.rows].make;
    // copy first-row pattern for pre-filled labels? always blank
    tb.insertAdjacentHTML('beforeend',mk());const last=tb.lastElementChild;$$('textarea',last).forEach(grow);const f=$('input:not([type=checkbox]),textarea',last);f&&f.focus();later();return}
  if(act==='del'){const tbody=a.closest('tbody');if(tbody.children.length>1||confirm('這是最後一列，確定刪除？')){a.closest('tr').remove();calc();later()}return}
  if(act==='addday'){$('.days',r).insertAdjacentHTML('beforeend',DAY());renumber();$$('textarea',$('.days',r).lastElementChild).forEach(grow);later();return}
  if(act==='delday'){if($$('.day',r).length>1&&confirm('刪除這一天的整個區塊？')){a.closest('.day').remove();renumber();later()}return}
  if(act==='addsec'){$('.secs',r).insertAdjacentHTML('beforeend',secBlock('',[],''));later();return}
  if(act==='delsec'){if(confirm('刪除這張明細表？')){a.closest('.secblk').remove();later()}return}
  if(act==='newblank'){const f=newForm(cur[curTab].type);cur[curTab].id=f.id;render();return}
  if(act==='dup'){saveNow();const f=curForm();const n=newForm(f.type,f.html,f.name+' (複本)');cur[curTab].id=n.id;render();return}
  if(act==='reset'){if(confirm('把這份表單清空，還原為標準空白表？(現有內容會消失)')){const f=curForm();f.html=TPL[f.type].build();f.updated=Date.now();saveAll();render()}return}
  if(act==='delform'){if(confirm('刪除這份表單？此動作無法復原。')){const f=curForm();forms=forms.filter(x=>x!==f);saveAll();cur[curTab].id=null;render()}return}
  if(act==='print'){saveNow();doPrint();return}
  if(act==='xls'||act==='doc'){saveNow();const c=flatten(r);const f=curForm();
    const body=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${e(f.name)}</title><style>${EXPORT_CSS}</style></head><body>${c.innerHTML}</body></html>`;
    download(fileName(act==='xls'?'xls':'doc'),act==='xls'?'application/vnd.ms-excel':'application/msword',body);return}
});
document.addEventListener('input',ev=>{if(!ev.target.closest(FA))return;if(ev.target.tagName==='TEXTAREA')grow(ev.target);later()});
document.addEventListener('change',ev=>{if(ev.target.id==='fname'){const f=curForm();if(f){f.name=ev.target.value.trim()||f.name;f.updated=Date.now();saveAll();render()}return}if(ev.target.closest(FA))later()});
$('#expAll').onclick=()=>{saveNow();download('大鷹SOP資料備份-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({v:1,forms},null,1))};
$('#impAll').onclick=()=>$('#impFile').click();
$('#impFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result.replace(/^﻿/,''));if(!Array.isArray(d.forms))throw 0;const ids=new Set(forms.map(x=>x.id));let n=0;d.forms.forEach(x=>{if(x&&x.type&&TPL[x.type]){if(ids.has(x.id))x.id=uid();forms.push(x);n++}});saveAll();alert('已匯入 '+n+' 份表單');render()}catch(_){alert('檔案格式不正確')}};rd.readAsText(f);ev.target.value=''};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==curTab&&TABS.find(t=>t.id===h)){curTab=h;render()}});
{const h=location.hash.slice(1);if(TABS.find(t=>t.id===h))curTab=h}
render();
</script>
